[[exclude]]
name = "LuaJIT-ImGui"
git = "https://github.com/sonoro1234/LuaJIT-ImGui"
decided = "2026-11-15"
by = "cannot be installed as JoyrIDE installs libraries; applied when asked to finish the library audits; the maintainer may lift it by deleting this entry"
facts = "At 216d510 (2026-11-12): MIT, Dear ImGui through LuaJIT's FFI, but the repository is CMake sources with nine git submodules (cimgui, cimplot, cimnodes and others) that the installer never fetches, and it builds its own shared library; it is not a LÖVE library (its examples use SDL or GLFW). cimgui-love (curated) is the Dear ImGui binding for LÖVE."

[[exclude]]
name = "love-imgui"
