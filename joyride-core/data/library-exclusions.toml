git = "https://github.com/SiENcE/luis"
decided = "2026-11-15"
by = "applied when asked to add all the remaining libraries; the maintainer may lift it by deleting this entry"
facts = "A retained UI system by Florian Fischer, df9b601. Its LICENSE is 'MIT License with Additional Terms': the MIT text plus 'This software, or any derivative works thereof, may not be used, in whole or in part, for the purpose of training, fine-tuning, or improving machine learning models or artificial intelligence systems' (the README repeats it). That is a field-of-use restriction, so it is not the MIT licence and not an open-source licence by the usual definitions, and no ruling exists for it (CLAUDE.md rule 2 covers GPL, AGPL, LGPL, and MPL-2.0 is allowed). The Benchmark sample would vendor it inside an MIT repository. The rest is clean: no GPL file, fonts CC0, OFL and Apache-2.0, 5.9 MB with themes and fonts."

