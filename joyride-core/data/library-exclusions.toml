decided = "2026-11-15"
by = "CLAUDE.md rule 2 (no GPL, AGPL or LGPL dependencies), applied when asked to finish the library audits; the maintainer may lift it by deleting this entry"
facts = "At 8e00ac6 (2026-11-11): a Processing-style creative coding framework (L5.lua plus examples). Its LICENSE is the full GNU Lesser General Public License 2.1."

[[exclude]]
name = "mlib"
