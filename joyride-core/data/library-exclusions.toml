facts = "At c6be4a8: its entry file ECS.lua is one minified line of 27,080 characters (the readable sources are in src/ and ECS_concat.lua, but the file a game requires is the minified build), so what a game would run cannot be reviewed under rule 14. The Roblox-oriented repository also carries 7 binary design files."

