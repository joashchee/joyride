facts = "A 9-slice library by wqferr, 1b63884 (2022-05-29). Its LICENSE is the full GNU GPL version 3 (674 lines) and nothing else in the repository states another licence. Patchy (MIT) is the curated 9-patch library."

[[exclude]]
