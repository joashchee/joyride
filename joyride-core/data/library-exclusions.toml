decided = "2026-11-15"
by = "cannot be installed as JoyrIDE installs libraries; applied when asked to work through the awesome-love2d list; the maintainer may lift it by deleting this entry"
facts = "At fac5bea: it loads its own class files with dofile(\"LOVELi/<class>.lua\"), a path from the game's root folder, so it cannot run from libs/ where JoyrIDE installs libraries (the probe failed with 'cannot open LOVELi/Math.lua' on real LÖVE 11.5 and 12.0); its README says to copy the folder to the game's root."

[[exclude]]
