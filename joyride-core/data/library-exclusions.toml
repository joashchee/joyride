facts = "At a6ff5f6: it requires an external library, `subclass`, from LuaRocks that the repository does not contain (require('subclass') in likelihud/Block.lua failed on real LÖVE 11.5 and 12.0), so a clone is not self-contained; its fonts folder also holds a CC BY-SA 3.0 font."

[[exclude]]
