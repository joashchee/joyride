decided = "2026-11-15"
by = "CLAUDE.md rule 2 (a GPL file anywhere in a library's tree keeps it out), applied when asked to finish the library audits; the maintainer may lift it by deleting this entry"
facts = "At 47aa1d8 (2024-01-03): mlib.lua is zlib-licensed (LICENSE.md) with hump's Vector2 (MIT) inside, but Examples/Source/Shapes/mlib.lua is an older copy whose header is the GNU General Public License, so the repository carries a GPL file. The installer clones the whole repository (3.5 MB of Examples). Could be reconsidered if the author removes that copy."

