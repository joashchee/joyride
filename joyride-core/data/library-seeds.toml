# The libraries JoyrIDE offers by name. `cargo run --example curate_libraries`
# clones each, pins a real commit (the newest tag if it has one) and reads its
# licence, then writes libraries.toml. With `-- --probe` it also requires each
# on real LÖVE 11.5 and 12.0 headless (that runs the library's code: opt-in).
# module = what to `require` after the repo is on the Lua path.

[[library]]
name = "hump"
git = "https://github.com/vrld/hump"
module = "hump.class"
summary = "Helper utilities: classes, gamestates, timers, vectors, signals, cameras."

[[library]]
name = "bump"
git = "https://github.com/kikito/bump.lua"
module = "bump"
summary = "Collision detection for axis-aligned rectangles."

[[library]]
name = "anim8"
git = "https://github.com/kikito/anim8"
module = "anim8"
summary = "Spritesheet animations."

[[library]]
name = "middleclass"
git = "https://github.com/kikito/middleclass"
module = "middleclass"
summary = "Object orientation for Lua."

[[library]]
name = "inspect"
git = "https://github.com/kikito/inspect.lua"
module = "inspect"
summary = "Human-readable representations of Lua tables."

[[library]]
name = "tween"
git = "https://github.com/kikito/tween.lua"
module = "tween"
caution = "When a tween of a nested table ends, the table's other fields are lost (tweening `pos.x` deletes `pos.y`): tween flat fields, or use hump.timer."
summary = "Tweening and easing functions."

[[library]]
name = "semver"
git = "https://github.com/kikito/semver.lua"
module = "semver"
summary = "Semantic version parsing and comparison."

[[library]]
name = "lume"
git = "https://github.com/rxi/lume"
module = "lume"
summary = "Collection of functions for game development."

[[library]]
name = "classic"
git = "https://github.com/rxi/classic"
module = "classic"
summary = "Tiny class module."

[[library]]
name = "flux"
git = "https://github.com/rxi/flux"
module = "flux"
summary = "Fast, lightweight tweening."

[[library]]
name = "json"
git = "https://github.com/rxi/json.lua"
module = "json"
summary = "Lightweight JSON encode and decode."

[[library]]
name = "log"
git = "https://github.com/rxi/log.lua"
module = "log"
summary = "Tiny logging module."

[[library]]
name = "lurker"
git = "https://github.com/rxi/lurker"
module = "lurker"
summary = "Auto-swaps changed Lua files in a running game (needs lume)."

[[library]]
name = "baton"
git = "https://github.com/tesselode/baton"
module = "baton"
summary = "Input library: keyboard, mouse and gamepad bindings."

[[library]]
name = "push"
git = "https://github.com/Ulydev/push"
module = "push"
summary = "Resolution-handling library."

[[library]]
name = "sti"
git = "https://github.com/karai17/Simple-Tiled-Implementation"
module = "sti"
caution = "Compressed tile layers (zlib, gzip, base64) are read through LuaJIT's FFI, so a web build needs the CSV layer format in Tiled."
summary = "Tiled map loader and renderer."

[[library]]
name = "binser"
git = "https://github.com/bakpakin/binser"
module = "binser"
summary = "Customizable Lua serializer."

[[library]]
name = "HC"
git = "https://github.com/vrld/HC"
module = "HC"
caution = "`HC:raycast` finds nothing for a ray heading right or down (only left or up work); use shape:intersectionsWithRay for those."
summary = "General purpose collision detection with arbitrary shapes."

# C libraries. kind = "ffi": the Lua code loads a shared library through LuaJIT's FFI.
# kind = "native": a compiled Lua module loaded with `require` (package.cpath).
# Adding one installs the pinned source; `native` says what binary still has to sit next to the game.
# Not run by --probe (they cannot load without their binary). Desktop only: the web build has no FFI.

[[library]]
name = "nativefs"
git = "https://github.com/EngineerSmith/nativefs"
module = "nativefs"
kind = "ffi"
native = "Nothing to ship: calls the C library already in the process (libc, or LÖVE's own on Windows)."
summary = "love.filesystem's API without its path limits: read and write any file on the computer."

[[library]]
name = "lua-discordRPC"
git = "https://github.com/pfirsich/lua-discordRPC"
module = "discordRPC"
kind = "ffi"
native = "Needs Discord's discord-rpc shared library (discord-rpc.dll, libdiscord-rpc.so or .dylib) next to the game. Discord has deprecated it in favour of its GameSDK."
summary = "Discord Rich Presence: show what the player is doing, through discord-rpc."

[[library]]
name = "luajit-request"
git = "https://github.com/LPGhatguy/luajit-request"
module = "luajit-request"
kind = "ffi"
native = "Needs libcurl with SSL: already on macOS and many Linux systems; on Windows, libcurl.dll next to the game."
summary = "HTTP and HTTPS requests (GET, POST, forms, cookies, file upload) through libcurl."

[[library]]
name = "luasteam"
git = "https://github.com/uspgamedev/luasteam"
module = "luasteam"
kind = "native"
caution = "Its repository includes Valve's Steamworks SDK (headers and binaries in sdk/), which is under Valve's own SDK agreement (sdk/LICENSE), not MIT. Read it, and keep libs/luasteam/sdk out of a game that is not released through Steam."
native = "Needs its compiled module (luasteam.so or .dll, from the repository's releases) and Valve's Steamworks library (libsteam_api, steam_api64.dll) from the Steamworks SDK, next to the game; Steam must be running."
summary = "The Steamworks API from Lua: achievements, stats, cloud saves, networking. Documented at luasteam.readthedocs.io; used by released Steam games."

[[library]]
name = "love-nuklear"
git = "https://github.com/keharriso/love-nuklear"
module = "nuklear"
kind = "native"
native = "Needs its compiled module (nuklear.so or .dll): Windows builds are on the releases page, other systems build it with CMake."
summary = "Nuklear, a lightweight immediate-mode GUI (windows, buttons, sliders, combo boxes) drawn by LÖVE."

[[library]]
name = "cimgui-love"
git = "https://codeberg.org/apicici/cimgui-love"
module = "src"
kind = "ffi"
native = "Needs the cimgui shared library (cimgui.dll, libcimgui.so or .dylib) from the release with the same version number as the pinned one, kept outside the .love file, with package.cpath pointing at it. The Lua code is the repository's src folder: require it as libs.cimgui-love.src."
summary = "Dear ImGui for LÖVE through LuaJIT's FFI (windows, menus, widgets, docking). Moved from GitHub to Codeberg."

# Pure Lua (work on every platform, the web build included). Added 2026-11-14 after a gap review;
# every one is audited (scripts/audit-libraries.py) before it is pinned and probed.

[[library]]
name = "tiny-ecs"
git = "https://github.com/bakpakin/tiny-ecs"
module = "tiny"
summary = "Entity-component-system: entities, systems and worlds, filtered by components."

[[library]]
name = "Slab"
git = "https://github.com/flamendless/Slab"
module = "Slab"
pin = "head"   # its newest tag (v0.9.0) is from 2021, the main branch from 2026
caution = "Its file dialog uses LuaJIT's FFI, so it works on desktop and not in the web build."
summary = "Immediate-mode GUI: windows, buttons, inputs, menus, dialogs, docking."

[[library]]
name = "suit"
git = "https://github.com/vrld/SUIT"
module = "suit"
pin = "head"   # its newest tag (v0.10) is from 2017, the main branch from 2019
summary = "Immediate-mode GUI: buttons, checkboxes, sliders, text inputs, layouts."

[[library]]
name = "gamera"
git = "https://github.com/kikito/gamera"
module = "gamera"
summary = "Camera: position, scale, rotation, world bounds and visible-area queries."

[[library]]
name = "jumper"
git = "https://github.com/Yonaba/Jumper"
module = "jumper.pathfinder"
summary = "Pathfinding on grids: A*, Dijkstra, Jump Point Search and others."

[[library]]
name = "g3d"
git = "https://github.com/groverburger/g3d"
module = "g3d"
caution = "Require it as `libs.g3d.g3d` (its path from the game's folder): it finds its shader from the name it was required by, so `require \"g3d\"` cannot find it."
summary = "Simple 3D: load models, camera, collisions, in plain LÖVE."

[[library]]
name = "batteries"
git = "https://github.com/1bardesign/batteries"
module = "batteries"
summary = "Toolkit: vectors, sets, state machines, timers, async, class, functional helpers, pooling."

[[library]]
name = "sock"
git = "https://github.com/camchenry/sock.lua"
module = "sock"
summary = "Networking over LÖVE's bundled enet: clients, servers, events, serialisation hooks."

[[library]]
name = "lovebird"
git = "https://github.com/rxi/lovebird"
module = "lovebird"
caution = "Development only, never ship it: it listens on port 8000 (all interfaces, accepting only 127.0.0.1) and runs any Lua typed into its web page, so a web page open in your browser may be able to reach it."
summary = "A browser debug console for a running game: prints output, evaluates Lua, shows variables."

[[library]]
name = "profile"
git = "https://github.com/2dengine/profile.lua"
module = "profile"
summary = "Sampling-free function profiler: call counts and times, with a report."

[[library]]
name = "lust"
git = "https://github.com/bjornbytes/lust"
module = "lust"
summary = "Tiny test framework: describe, it, expect, before and after."

[[library]]
name = "peachy"
git = "https://github.com/josh-perry/peachy"
module = "peachy"
summary = "Aseprite animations: load the .json and .png Aseprite exports, play tagged animations."

[[library]]
name = "love-loader"
git = "https://github.com/kikito/love-loader"
module = "love-loader"
caution = "It reads its own source as `love-loader.lua` from the game's root folder, so copy that one file there; it does not work from libs/."
summary = "Loads images, sounds and fonts in a thread with a progress count, so a loading screen can draw."

[[library]]
name = "ripple"
git = "https://github.com/tesselode/ripple"
module = "ripple"
summary = "Audio: tags with shared volume, instances, fades and per-sound settings."

[[library]]
name = "moonshine"
git = "https://github.com/vrld/moonshine"
module = "moonshine"
summary = "Post-processing shader effects you chain: blur, CRT, glow, grain, scanlines, vignette and more."

# Added 2026-11-14: ansiapps' own MIDI synthesizer (also vendored into JoyrIDE for file previews). Audited before it is pinned.
[[library]]
name = "neumetik-midi"
git = "https://github.com/joashchee/neumetik-midi"
module = "bindings.love.neumetik_midi"
kind = "ffi"
pin = "head"   # no release tags; the repository is a synced copy of the library, and each sync is a commit
caution = "Require it as `libs.neumetik-midi.bindings.love.neumetik_midi`. Its native library has to be built for each platform you ship (desktop, Android, PortMaster); it cannot run in the web build, and on iOS the library must be embedded in the app."
native = "Needs its shared library (libneumetik_midi.dylib, libneumetik_midi.so or neumetik_midi.dll), built from capi/ with cargo build --release (Rust, no dependencies; about 0.5 MB), kept beside the game or in its save folder. No SoundFont is needed: it synthesizes every instrument itself, and plays a SoundFont or DLS bank too if you load one."
summary = "General MIDI and GS music with no SoundFont: a small synthesizer you feed a .mid file and play through a LÖVE queueable source (loops, fades, seeking, muted channels, live notes), or through a SoundFont or DLS bank you give it."

[[library]]
name = "cpml"
git = "https://github.com/excessive/cpml"
module = "cpml"
caution = "Its vectors use LuaJIT's FFI when it is there and fall back to tables when it is not (so the web build works, slower). LICENSE.md lists a few parts from other authors under MIT, BSD-2-Clause or CC0."
summary = "Cirno's Perfect Math Library: vectors, matrices, quaternions, intersections, easing, noise, colours and more."

[[library]]
name = "luaunit"
git = "https://github.com/bluebird75/luaunit"
module = "luaunit"
tag = "LUAUNIT_V3_5"
caution = "The repository also carries its own test runner (run_functional_tests.lua, which calls os.execute) and example output files; the library itself writes a file only when you ask for an output file, and reads LUAUNIT_* environment variables. Its `run` and `runSuiteByInstances` read the program's command line, so a game started with an option luaunit does not know (like `--report`) prints luaunit's usage text: call `runSuiteByInstancesNoCmdLineParsing`. Use it from your own test script, not in the shipped game."
summary = "Unit testing framework in the xUnit style: assertions, test suites, a command-line runner (run it with plain Lua or LÖVE)."

[[library]]
name = "bitser"
git = "https://github.com/gvx/bitser"
module = "bitser"
caution = "Needs LuaJIT's FFI, so it cannot run in the web build. Its demo main.lua uses loadstring (not the library). Not audited for hostile input: treat a save file from someone else as untrusted."
summary = "Fast, compact binary serialisation of Lua values, with metatables and cycles (LuaJIT)."

[[library]]
name = "talkies"
git = "https://github.com/tanema/talkies"
module = "talkies"
caution = "The example/ folder includes a font under Creative Commons Attribution (Pixel UniCode by ivancr72) and a bfxr sound: do not ship example/ with a game without crediting them."
summary = "Simple dialogue boxes: queued messages, typewriter text, avatars, options and a font and colour theme."

[[library]]
name = "roomy"
git = "https://github.com/tesselode/roomy"
module = "roomy"
summary = "Scene (room) manager: push, pop and switch scenes that receive LÖVE's callbacks."

[[library]]
name = "Concord"
git = "https://github.com/Concord-Studio/Concord"
module = "Concord"
summary = "Entity component system: entities, components, systems, worlds and assemblages, with events between systems."

[[library]]
name = "cron"
git = "https://github.com/kikito/cron.lua"
module = "cron"
summary = "Time-related callbacks: after a delay, or every so often, as small clocks you update yourself."

[[library]]
name = "i18n"
git = "https://github.com/kikito/i18n.lua"
module = "i18n"
caution = "`i18n.loadFile` uses plain `loadfile` on an operating-system path, so it cannot read a file inside a packaged .love; load the file yourself with `love.filesystem.load` and pass the table to `i18n.load`."
summary = "Internationalisation: translations with interpolation, pluralisation, locale fallbacks and loading from tables or files."

[[library]]
name = "cargo"
git = "https://github.com/bjornbytes/cargo"
module = "cargo"
caution = "Does not work on LÖVE 12.0: it calls `love.filesystem.isDirectory` and `exists`, which 12.0 removed (measured: indexing a folder raises \"attempt to call field 'isDirectory'\"). On 11.5 its loaders for images, sound and fonts need LÖVE's graphics and audio. It runs every .lua file in the folder you point it at (`love.filesystem.load(path)()`): point it only at folders of your own assets. Unmaintained since 2020."
summary = "Assets as tables: a folder of images, sounds, fonts and Lua files you index by name and that load on first use."
