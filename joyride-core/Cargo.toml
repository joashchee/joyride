[package]
name = "joyride-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "JoyrIDE's Tauri-free core: love.toml, toolchains, runner output, the Lua scanner, shims, patch overlays and exporters."

[dependencies]
asset-core = { path = "../asset-core" }
blake3 = "1"
ed25519-dalek = "2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
plist = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
toml = "0.8"
