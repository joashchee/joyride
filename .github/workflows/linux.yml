# Builds JoyrIDE for Linux: the .deb and the .rpm, uploaded as the run's
# artifact and published to a release (scripts/publish-release.sh). By
# hand (Actions -> Linux build -> Run workflow), on a version tag, and on
# a change to this file. Ubuntu 22.04, so the packages run on its glibc
# and newer. Copied from Coupler's, which works the same way.
# No AppImage: it would ship WebKitGTK and GTK inside it, both LGPL, and
# JoyrIDE bundles no GPL/LGPL code (CLAUDE.md rule 2). The .deb and .rpm
# use the system's own.
# Standard GitHub-hosted runners only, in this public repository, so it
# stays free and unlimited (CLAUDE.md, "Build notes").
name: Linux build

on:
  workflow_dispatch:
  push:
    # Path filters don't apply to tags: every v* tag builds.
    branches: ["**"]
    tags: ["v*"]
    paths: [".github/workflows/linux.yml"]
  pull_request:
    paths: [".github/workflows/linux.yml"]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Tauri's system libraries.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            libxdo-dev patchelf rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Keep the runner's paths out of the binary, as build-release.sh
      # does on the Mac (rustc's panics).
      - name: Remap source paths
        run: |
          echo "RUSTFLAGS=--remap-path-prefix=$HOME=~ --remap-path-prefix=$GITHUB_WORKSPACE=." >> "$GITHUB_ENV"

      - run: npm run tauri build -- --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: joyride-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  # Every successful build on main or a v* tag goes to a release: the
  # version's own, or the dev prerelease between versions
  # (scripts/publish-release.sh says which). Not pull requests, nor other
  # branches: they'd replace main's files.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: joyride-linux
          path: dist

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar
          scripts/publish-release.sh dist/**/*.deb dist/**/*.rpm
